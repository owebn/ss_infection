# Conda environment for running ss_infection PDE simulations.
#   conda env create -f environment.yml
#   conda activate ss-infection
# Tested with python 3.11, fenics-dolfinx 0.9.0, petsc 3.22, openmpi 5.
name: ss-infection
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.9
  - mpi4py
  - petsc4py
  - numpy>=2.0
  - scipy
  - matplotlib
  - pip
  - pip:
      - -e .[dev]
