# Minimal conda environment for ss_infection (FEniCSx PDE simulations).
#   conda env create -f environment.yml
#   conda activate fenicsx
#   pip install -e .
# Developed with python 3.11.8, fenics-dolfinx 0.9.0, petsc 3.22.2,
# openmpi 5.0.8, numpy 2.4.6, scipy 1.17.1, matplotlib 3.10.6.
name: fenicsx
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fenics-dolfinx=0.9.0   # pulls in basix, ffcx, ufl, petsc, mpi
  - petsc4py
  - mpi4py
  - numpy>=2.0
  - scipy
  - matplotlib-base
  - pip
  - flake8                 # development only
